name: Torch3 release

# Builds unsigned Torch3 installers for macOS, Windows and Linux, packs the `torch3` npm
# package, publishes both to a GitHub Release, and publishes npm when NPM_TOKEN is set.
# Upstream's release.yml only runs in pingdotgg/t3code; this is the fork's release path.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: torch3-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            args: --platform mac --target dmg --arch arm64
          - name: Linux x64
            os: ubuntu-24.04
            args: --platform linux --target AppImage --arch x64
          - name: Windows x64
            os: windows-2025
            args: --platform win --target nsis --arch x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-ci-deps

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      # Unsigned: macOS asks for right-click > Open once; Windows SmartScreen shows "More info".
      - name: Build installer
        shell: bash
        run: >-
          vp run dist:desktop:artifact ${{ matrix.args }}
          --build-version "${{ needs.version.outputs.version }}"
          --output-dir release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 7

  npm:
    name: npm package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-ci-deps

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Pack torch3
        run: node scripts/build-torch3-npm.ts --version "${{ needs.version.outputs.version }}" --output-dir release/npm

      - name: Smoke-test the packed CLI
        run: |
          cd "$RUNNER_TEMP"
          npx --yes --package "$GITHUB_WORKSPACE/release/npm/torch3-${{ needs.version.outputs.version }}.tgz" torch3 --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: release/npm/torch3-*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish
    needs: [version, desktop, npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Torch3 $VERSION" \
            --generate-notes

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set, so torch3@$VERSION was not published to npm."
            exit 0
          fi
          npm publish "assets/torch3-$VERSION.tgz" --access public
